<!DOCTYPE html>
<html>
<head>
  <title>Watch Party</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎬 Watch Party</h1>
  <span id="hostBadge">HOST</span>
</header>

<section class="actions">
  <button id="createRoom">Create Room</button>
  <button id="joinRoom">Join Room</button>
</section>

<section class="share">
  <label>🔗 Share Room Link</label>
  <input id="roomLink" readonly />
</section>

<section class="movie">
  <video id="movie" controls></video>
  <input type="file" id="movieInput" accept="video/*">
</section>

<section class="controls">
  <button id="micBtn">🎤</button>
  <button id="camBtn">📷</button>
  <button id="screenBtn">🖥</button>
  <button id="recordBtn">⏺</button>
</section>

<section class="participants">
  <video id="localCam" autoplay muted></video>
  <div id="remotes"></div>
</section>

<section class="chat">
  <div id="messages"></div>
  <input id="chatInput" placeholder="Message">
  <button id="sendBtn">Send</button>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
<script src="main.js"></script>
</body>
</html>
